# Publishes what the studio dashboard (/studio-upload/) sends:
# photos converted to WebP in several sizes, data updated, pages rebuilt, result committed.
# The commit then redeploys Netlify and GitHub Pages as any push does.
name: Publish from the studio dashboard

on:
  push:
    branches: [main]
    paths: ['content/inbox/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Photo tools
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)

      - name: Apply the dashboard requests
        id: inbox
        run: node tools/publish-inbox.js

      - name: Rebuild the pages
        run: node build.js

      - name: Commit and push
        env:
          SUMMARY: ${{ steps.inbox.outputs.summary }}
        run: |
          git config user.name "H&A studio dashboard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Studio dashboard: ${SUMMARY:-published}"
          git pull --rebase -q origin main
          git push origin HEAD:main

      - name: Ask GitHub Pages to redeploy
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null && echo "Pages build requested."
