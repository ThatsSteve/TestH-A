# Netlify: the site is already built (static HTML), so there is nothing to compile.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The studio dashboard stays out of search engines
[[headers]]
  for = "/studio-upload/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
